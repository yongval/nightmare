<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Fever Field</title>
    <link rel="stylesheet" href="style.css?v=controls-v2" />
  </head>
  <body data-release="controls-v2">
    <main id="artwork" aria-label="Interactive black-and-white geometric artwork"></main>
    <div id="research-labels" aria-hidden="true">
      <span>CORTICAL / PATTERN SPACE</span>
      <span>PERCEPTUAL / TRANSFORMED SPACE</span>
    </div>
    <output id="information" aria-live="polite"></output>
    <nav id="controls" aria-label="Artwork controls">
      <button type="button" data-action="family"><span>PATTERN</span><strong>ROLLS</strong></button>
      <button type="button" data-action="mapping"><span>SPACE</span><strong>CARTESIAN</strong></button>
      <button type="button" data-action="symmetry"><span>ROTATION</span><strong>2222</strong></button>
      <button type="button" data-action="research" aria-pressed="false"><span>VIEW</span><strong>FULL</strong></button>
      <button type="button" data-action="pause" aria-pressed="false"><span>MOTION</span><strong>PLAYING</strong></button>
    </nav>
    <noscript>This artwork requires JavaScript and WebGL.</noscript>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
    <script type="module" src="src/main.js?v=controls-v2"></script>
  </body>
</html>
