name: Deploy static artwork to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Verify artwork release
        run: |
          test -f docs/.nojekyll
          grep -q 'aria-label="Interactive black-and-white geometric artwork"' docs/index.html
          grep -q 'src/main.js?v=' docs/index.html
          grep -q 'data-release="wallpaper-v2"' docs/index.html
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
